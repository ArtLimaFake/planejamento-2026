<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Hoje</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap');

:root {
  --bg:#0d0f14;--surface:#141720;--surface2:#1c2030;--border:#252a3a;
  --accent:#f0c040;--accent2:#4fd1a0;--accent3:#f07070;--accent4:#7090f0;
  --text:#e8eaf0;--muted:#7880a0;--danger:#f05060;--warn:#f0a040;--invest:#f0d080;
  --radius:12px;--radius-sm:8px;
}
[data-theme="light"] {
  --bg:#f2f3f7;--surface:#ffffff;--surface2:#eaecf4;--border:#d0d4e4;
  --accent:#b08000;--accent2:#1a9e72;--accent3:#c03040;--accent4:#3060d0;
  --text:#14182a;--muted:#5868a0;--danger:#c02030;--warn:#b06000;--invest:#806000;
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{min-height:100vh;background:var(--bg);color:var(--text);font-family:'Syne',sans-serif;}

/* header */
.top-bar{
  position:sticky;top:0;z-index:100;
  background:var(--bg);border-bottom:1px solid var(--border);
  padding:12px 16px 10px;
  display:flex;flex-direction:column;gap:4px;
}
.top-row{display:flex;justify-content:space-between;align-items:center;}
.top-bar h1{font-size:1.25rem;font-weight:800;color:var(--accent);letter-spacing:-0.5px;}
.top-weekday{font-size:1.35rem;font-weight:800;color:var(--text);letter-spacing:-0.5px;line-height:1.1;}
.top-date{font-family:'Space Mono',monospace;font-size:0.68rem;color:var(--muted);}
.clock-row{margin-top:8px;padding-top:8px;border-top:1px solid var(--border);}
.clock-wrap{display:flex;align-items:center;gap:8px;}
.clock-time{font-family:'Space Mono',monospace;font-size:1.6rem;font-weight:700;color:var(--accent);letter-spacing:-1px;line-height:1;}
.clock-sep{color:var(--border);font-size:1rem;}
.clock-current{font-size:0.82rem;font-weight:700;color:var(--text);line-height:1;}
.clock-next{font-size:0.7rem;color:var(--muted);margin-top:3px;font-family:'Space Mono',monospace;}
.phase-badge{
  display:inline-block;padding:3px 10px;border-radius:20px;
  font-family:'Space Mono',monospace;font-size:0.65rem;font-weight:700;
  border:1px solid;
}
.phase-badge.f1{border-color:var(--danger);color:var(--danger);}
.phase-badge.f2{border-color:var(--warn);color:var(--warn);}
.phase-badge.f3{border-color:var(--accent);color:var(--accent);}
.phase-badge.f4{border-color:var(--accent2);color:var(--accent2);}
.phase-badge.f5{border-color:var(--accent4);color:var(--accent4);}

.theme-btn{
  background:var(--surface2);border:1px solid var(--border);
  color:var(--muted);border-radius:20px;padding:4px 12px;
  font-family:'Space Mono',monospace;font-size:0.65rem;cursor:pointer;
}

/* progress bar */
.progress-wrap{padding:10px 16px 0;}
.progress-label{display:flex;justify-content:space-between;font-family:'Space Mono',monospace;font-size:0.65rem;color:var(--muted);margin-bottom:5px;}
.progress-track{height:5px;background:var(--surface2);border-radius:3px;overflow:hidden;}
.progress-fill{height:100%;background:var(--accent2);border-radius:3px;transition:width .4s ease;}

/* day nav */
.week-label-row{padding:8px 16px 0;display:flex;justify-content:center;}
.week-label{font-family:'Space Mono',monospace;font-size:0.65rem;color:var(--muted);background:var(--surface2);padding:3px 12px;border-radius:20px;border:1px solid var(--border);}
.day-nav{display:flex;gap:5px;padding:8px 16px 12px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;align-items:center;}
.day-nav::-webkit-scrollbar{display:none;}
.week-nav-btn{flex-shrink:0;width:28px;height:44px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--muted);display:flex;align-items:center;justify-content:center;font-size:1.1rem;cursor:pointer;}
.week-nav-btn:active{background:var(--surface2);}
.day-pill{
  flex-shrink:0;padding:5px 10px;border-radius:10px;
  font-family:'Space Mono',monospace;font-size:0.65rem;cursor:pointer;
  border:1px solid var(--border);background:var(--surface);color:var(--muted);
  transition:all .15s;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:40px;
}
.day-pill.active{background:var(--accent);color:#000;border-color:var(--accent);font-weight:700;}
.day-pill.today{border-color:var(--accent2);color:var(--accent2);}
.day-pill.today.active{background:var(--accent);color:#000;border-color:var(--accent);}
.pill-name{font-size:0.65rem;font-weight:700;}
.pill-date{font-size:0.58rem;opacity:0.75;}

/* blocks list */
.blocks{padding:0 16px 100px;}

.block-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  margin-bottom:8px;overflow:hidden;transition:border-color .15s;
}
.block-card.done{border-color:var(--accent2);opacity:0.75;}
.block-card.skipped{border-color:var(--danger);opacity:0.7;}
.block-card.swapped{border-color:var(--warn);}

.block-header{
  display:flex;align-items:center;gap:10px;padding:11px 12px;cursor:pointer;
}
.block-time{
  font-family:'Space Mono',monospace;font-size:0.62rem;color:var(--muted);
  min-width:80px;flex-shrink:0;line-height:1.4;
}
.block-main{flex:1;min-width:0;}
.block-label{
  display:inline-flex;align-items:center;gap:5px;
  font-size:0.75rem;font-weight:700;padding:2px 8px;border-radius:5px;margin-bottom:3px;
}
.block-note{font-size:0.72rem;color:var(--muted);line-height:1.4;word-break:break-word;}
.block-swap-note{font-size:0.71rem;color:var(--warn);line-height:1.4;margin-top:4px;font-style:italic;}

.status-dot{
  width:22px;height:22px;border-radius:50%;
  border:2px solid var(--border);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:11px;transition:all .15s;cursor:pointer;
}
.status-dot.done{background:var(--accent2);border-color:var(--accent2);color:#000;}
.status-dot.skipped{background:var(--danger);border-color:var(--danger);color:#fff;}
.status-dot.swapped{background:var(--warn);border-color:var(--warn);color:#000;}

/* action sheet */
.action-sheet-overlay{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:200;
  align-items:flex-end;
}
.action-sheet-overlay.open{display:flex;}
.action-sheet{
  background:var(--surface);border-radius:20px 20px 0 0;
  width:100%;padding:16px 16px 32px;
  border-top:1px solid var(--border);
}
.sheet-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 16px;}
.sheet-title{font-size:0.75rem;font-family:'Space Mono',monospace;color:var(--muted);margin-bottom:12px;text-transform:uppercase;letter-spacing:1px;}
.sheet-block-name{font-size:1rem;font-weight:700;margin-bottom:16px;color:var(--accent);}

.sheet-btn{
  display:flex;align-items:center;gap:12px;
  width:100%;padding:13px 14px;border-radius:var(--radius-sm);
  border:1px solid var(--border);background:var(--surface2);
  color:var(--text);font-family:'Syne',sans-serif;font-size:0.88rem;
  margin-bottom:8px;cursor:pointer;text-align:left;
  transition:all .15s;
}
.sheet-btn:active{opacity:.7;}
.sheet-btn .btn-icon{font-size:1.1rem;width:28px;text-align:center;}
.sheet-btn.btn-done{border-color:var(--accent2);color:var(--accent2);}
.sheet-btn.btn-skip{border-color:var(--danger);color:var(--danger);}
.sheet-btn.btn-swap{border-color:var(--warn);color:var(--warn);}
.sheet-btn.btn-undo{border-color:var(--border);color:var(--muted);}

.swap-area{display:none;flex-direction:column;gap:8px;margin-top:4px;}
.swap-area.open{display:flex;}
.swap-input{
  width:100%;padding:10px 12px;border-radius:var(--radius-sm);
  background:var(--surface2);border:1px solid var(--border);
  color:var(--text);font-family:'Syne',sans-serif;font-size:0.88rem;
}
.swap-input::placeholder{color:var(--muted);}
.swap-confirm{
  padding:10px;border-radius:var(--radius-sm);
  background:var(--warn);color:#000;font-weight:700;font-size:0.85rem;
  border:none;cursor:pointer;font-family:'Syne',sans-serif;
}

/* label colors */
.lbl-trabalho{background:#1a2535;color:#6090d0;}
.lbl-concurso{background:#2a1a1a;color:#f07070;}

[data-theme="light"] .lbl-pausa{background:#f4f4f4;color:#505050;}
[data-theme="light"] .lbl-lanche{background:#fff8f0;color:#804020;}
[data-theme="light"] .lbl-almoco{background:#fff4e8;color:#905020;}
[data-theme="light"] .lbl-redacao{background:#ffe8e8;color:#901030;}
[data-theme="light"] .lbl-trajeto{background:#e8eef8;color:#304060;}

/* summary footer */
.summary-bar{
  position:fixed;bottom:0;left:0;right:0;
  background:var(--bg);border-top:1px solid var(--border);
  padding:10px 16px 20px;
  display:flex;gap:10px;justify-content:space-around;
}
.sum-item{text-align:center;}
.sum-num{font-family:'Space Mono',monospace;font-size:1.1rem;font-weight:700;}
.sum-num.done-num{color:var(--accent2);}
.sum-num.skip-num{color:var(--danger);}
.sum-num.swap-num{color:var(--warn);}
.sum-num.pending-num{color:var(--muted);}
.sum-label{font-size:0.62rem;color:var(--muted);font-family:'Space Mono',monospace;}

/* empty */
.empty-msg{text-align:center;padding:40px 20px;color:var(--muted);font-size:0.85rem;line-height:1.7;}
.current-block{border-color:var(--accent) !important;box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 25%,transparent);}
.current-block .block-time{color:var(--accent);}
</style>
</head>

<div class="top-bar">
  <div class="top-row">
    <div>
      <div class="top-weekday" id="top-weekday">—</div>

    </div>

      <span class="phase-badge" id="phase-badge">—</span>
      <button class="theme-btn" onclick="toggleTheme()" id="theme-btn">☀</button>
    </div>
  </div>
  <div class="clock-row">
    <div class="clock-wrap">
      <span class="clock-time" id="clock-time">--:--</span>
      <span class="clock-sep">·</span>
      <span class="clock-current" id="clock-current">—</span>
    </div>
    <div class="clock-next" id="clock-next"></div>
  </div>
</div>

<div class="progress-wrap">
  <div class="progress-label">
    <span id="prog-label">0 de 0 tarefas</span>
    <span id="prog-pct">0%</span>
  </div>
  <div class="progress-track"><div class="progress-fill" id="prog-fill" style="width:0%"></div></div>
</div>

<div class="week-label-row"><span id="week-label" class="week-label">Semana atual</span></div>
<div class="day-nav" id="day-nav"></div>

<div class="blocks" id="blocks-list"></div>

<div class="summary-bar">
  <div class="sum-item"><div class="sum-num done-num" id="s-done">0</div><div class="sum-label">feitas</div></div>
  <div class="sum-item"><div class="sum-num skip-num" id="s-skip">0</div><div class="sum-label">puladas</div></div>
  <div class="sum-item"><div class="sum-num swap-num" id="s-swap">0</div><div class="sum-label">trocadas</div></div>
  <div class="sum-item"><div class="sum-num pending-num" id="s-pend">0</div><div class="sum-label">pendentes</div></div>
</div>

<div class="action-sheet-overlay" id="overlay" onclick="closeSheet(event)">
  <div class="action-sheet" id="action-sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title">marcar bloco</div>
    <div class="sheet-block-name" id="sheet-block-name">—</div>
    <button class="sheet-btn btn-done" onclick="setStatus('done')"><span class="btn-icon">✓</span> Feita</button>
    <button class="sheet-btn btn-skip" onclick="setStatus('skipped')"><span class="btn-icon">✕</span> Não fiz</button>
    <button class="sheet-btn btn-swap" onclick="openSwap()"><span class="btn-icon">⇄</span> Troquei por outra coisa</button>
    <div class="swap-area" id="swap-area">
      <input class="swap-input" type="text" id="swap-input" placeholder="O que você fez no lugar?" maxlength="120">
      <button class="swap-confirm" onclick="confirmSwap()">Confirmar troca</button>
    </div>
    <button class="sheet-btn btn-undo" onclick="setStatus(null)" style="margin-top:4px;"><span class="btn-icon">↩</span> Desfazer</button>
  </div>
</div>

      {time:'12:00+', label:'Descanso · família', cls:'familia', note:''},
    ],
  },
};

const WEEK_MAP = {f1:{'seg-qua':['seg','qua'],'ter':['ter'],'qui':['qui'],'sex':['sex'],'sab':['sab'],'dom':['dom']},f2:{'seg-qua':['seg','qua'],'ter-qui':['ter','qui'],'sex':['sex'],'sab':['sab'],'dom':['dom']},f3:{'seg-qua':['seg','qua'],'ter-qui':['ter','qui'],'sex':['sex'],'sab':['sab'],'dom':['dom']},f4:{'seg-qua':['seg','qua'],'ter-qui':['ter','qui'],'sex':['sex'],'sab':['sab'],'dom':['dom']},f5:{'seg-qua':['seg','qua'],'ter-qui':['ter','qui'],'sex':['sex'],'sab':['sab'],'dom':['dom']}};
const JS_DAY_MAP = {0:'dom',1:'seg',2:'ter',3:'qua',4:'qui',5:'sex',6:'sab'};
const DAY_LABELS = {seg:'Seg',qua:'Qua',ter:'Ter',qui:'Qui',sex:'Sex',sab:'Sáb',dom:'Dom'};
const MONTH_BR = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];

let currentPhase = 'f1';
let selectedDay = 'seg';
let weekOffset = 0; // 0 = current week, 1 = next week, -1 = last week
let openBlockIdx = null;
let statuses = {};

function toDateStr(d){ return d.toISOString().split('T')[0]; }

function getPhase(dateStr){
  for(const p of PHASE_RANGES){
    if(dateStr >= p.start && dateStr <= p.end) return p;
  }
  return PHASE_RANGES[PHASE_RANGES.length-1];
}

function getDayKey(phase, dayCode){
  const wmap = WEEK_MAP[phase];
  for(const [k,days] of Object.entries(wmap)){
    if(days.includes(dayCode)) return k;
  }
  return null;
}

function getBlocks(phase, dayCode){
  const key = getDayKey(phase, dayCode);
  if(!key) return [];
  return (DAYS[phase]||{})[key] || [];
}

function storageKey(dateStr, dayCode){ return `tasks:${dateStr}:${dayCode}`; }

function loadStatuses(dateStr, dayCode){
  try{
    const raw = localStorage.getItem(storageKey(dateStr, dayCode));
    statuses = raw ? JSON.parse(raw) : {};
  } catch(e){ statuses = {}; }
}

function saveStatuses(dateStr, dayCode){
  try{ localStorage.setItem(storageKey(dateStr, dayCode), JSON.stringify(statuses)); }
  catch(e){}
}

function formatDate(d){
  const days=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
  return `${days[d.getDay()]}, ${d.getDate()} ${MONTH_BR[d.getMonth()]} ${d.getFullYear()}`;
}

let currentDateStr = '';
let currentDayCode = '';

function getDateForDay(dayCode, wOffset){
  const today = new Date();
  const JS_DOW = {seg:1,ter:2,qua:3,qui:4,sex:5,sab:6,dom:0};
  const toMon = d => (d + 6) % 7;
  const todayMon = toMon(today.getDay());
  const selMon = toMon(JS_DOW[dayCode]);
  const diff = selMon - todayMon + (wOffset * 7);
  const d = new Date(today);
  d.setDate(today.getDate() + diff);
  return d;
}

function renderDayNav(phase){
  const nav = document.getElementById('day-nav');
  const today = new Date();
  const todayStr = toDateStr(today);
  const todayCode = JS_DAY_MAP[today.getDay()];
  const days = Object.values(WEEK_MAP[phase]).flat();
  const unique = [...new Set(days)];
  const order = ['seg','ter','qua','qui','sex','sab','dom'];
  const sorted = order.filter(d=>unique.includes(d));

  nav.innerHTML = '';

  // prev week button
  const prev = document.createElement('div');
  prev.className = 'week-nav-btn';
  prev.textContent = '‹';
  prev.title = 'Semana anterior';
  prev.onclick = ()=>{ weekOffset--; renderAll(); };
  nav.appendChild(prev);

  sorted.forEach(d=>{
    const dayDate = getDateForDay(d, weekOffset);
    const dayDateStr = toDateStr(dayDate);
    const isToday = dayDateStr === todayStr;
    const pill = document.createElement('div');
    pill.className = 'day-pill' + (d===selectedDay?' active':'') + (isToday?' today':'');
    pill.innerHTML = `<span class="pill-name">${DAY_LABELS[d]}</span><span class="pill-date">${dayDate.getDate()}/${dayDate.getMonth()+1}</span>`;
    pill.onclick = ()=>{ selectedDay=d; renderAll(); };
    nav.appendChild(pill);
  });

  // next week button
  const next = document.createElement('div');
  next.className = 'week-nav-btn';
  next.textContent = '›';
  next.title = 'Próxima semana';
  next.onclick = ()=>{ weekOffset++; renderAll(); };
  nav.appendChild(next);

  // week label
  const weekLabel = document.getElementById('week-label');
  if(weekOffset===0) weekLabel.textContent = 'Semana atual';
  else if(weekOffset===1) weekLabel.textContent = 'Próxima semana';
  else if(weekOffset===-1) weekLabel.textContent = 'Semana passada';
  else if(weekOffset>0) weekLabel.textContent = `+${weekOffset} semanas`;
  else weekLabel.textContent = `${weekOffset} semanas`;
}

function renderBlocks(){
  const list = document.getElementById('blocks-list');
  const blocks = getBlocks(currentPhase, selectedDay);

  if(!blocks.length){
    list.innerHTML = '<div class="empty-msg">Nenhum bloco para esse dia nessa fase.</div>';
    return;
  }

  let done=0,skip=0,swap=0,pend=0;
  list.innerHTML = '';

  blocks.forEach((b,i)=>{
    const st = statuses[i] || {};
    if(st.status==='done') done++;
    else if(st.status==='skipped') skip++;
    else if(st.status==='swapped') swap++;
    else pend++;

    const card = document.createElement('div');
    card.className = 'block-card' + (st.status?' '+st.status:'');
    card.innerHTML = `
      <div class="block-header" onclick="openSheet(${i})">
        <div class="block-time">${b.time}</div>
        <div class="block-main">
          <div><span class="block-label lbl-${b.cls}">${b.label}</span></div>
          ${b.note?`<div class="block-note">${b.note}</div>`:''}
          ${st.status==='swapped'&&st.swap?`<div class="block-swap-note">⇄ ${st.swap}</div>`:''}
        </div>
        <div class="status-dot ${st.status||''}">${st.status==='done'?'✓':st.status==='skipped'?'✕':st.status==='swapped'?'⇄':''}</div>
      </div>`;
    list.appendChild(card);
  });

  document.getElementById('s-done').textContent=done;
  document.getElementById('s-skip').textContent=skip;
  document.getElementById('s-swap').textContent=swap;
  document.getElementById('s-pend').textContent=pend;
  setTimeout(tickClock,0);

  const total=blocks.length;
  const pct=total?Math.round((done+skip+swap)/total*100):0;
  document.getElementById('prog-fill').style.width=pct+'%';
  document.getElementById('prog-label').textContent=`${done+skip+swap} de ${total} tarefas`;
  document.getElementById('prog-pct').textContent=pct+'%';
}

function renderAll(){
  const today = new Date();
  const todayStr = toDateStr(today);
  const phase = getPhase(todayStr);
  currentPhase = phase.id;

  // if selected day not in phase, pick today
  const available = Object.values(WEEK_MAP[currentPhase]).flat();
  if(!available.includes(selectedDay)){
    selectedDay = JS_DAY_MAP[today.getDay()];
  }

  // compute which actual date selectedDay refers to, considering weekOffset
  const selDate = getDateForDay(selectedDay, weekOffset);
  currentDateStr = toDateStr(selDate);
  currentDayCode = selectedDay;

  loadStatuses(currentDateStr, currentDayCode);

  const fullDays=['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];
  document.getElementById('top-weekday').textContent = fullDays[selDate.getDay()];
  document.getElementById('today-label').textContent = `${selDate.getDate()} de ${['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'][selDate.getMonth()]} de ${selDate.getFullYear()}`;
  const badge = document.getElementById('phase-badge');
  badge.textContent = phase.label;
  badge.className = 'phase-badge '+phase.id;

  renderDayNav(currentPhase);
  renderBlocks();
}

function openSheet(idx){
  openBlockIdx = idx;
  const b = getBlocks(currentPhase, selectedDay)[idx];
  document.getElementById('sheet-block-name').textContent = b.label + (b.time?' · '+b.time:'');
  document.getElementById('swap-area').classList.remove('open');
  document.getElementById('swap-input').value = (statuses[idx]||{}).swap || '';
  document.getElementById('overlay').classList.add('open');
}

function closeSheet(e){
  if(e.target===document.getElementById('overlay')||e===true){
    document.getElementById('overlay').classList.remove('open');
    openBlockIdx=null;
  }
}

function setStatus(s){
  if(openBlockIdx===null) return;
  if(s===null){ delete statuses[openBlockIdx]; }
  else { statuses[openBlockIdx]={status:s}; }
  saveStatuses(currentDateStr, currentDayCode);
  closeSheet(true);
  renderBlocks();
}

function openSwap(){
  document.getElementById('swap-area').classList.add('open');
  document.getElementById('swap-input').focus();
}

function confirmSwap(){
  if(openBlockIdx===null) return;
  const txt = document.getElementById('swap-input').value.trim();
  statuses[openBlockIdx] = {status:'swapped', swap: txt||'(sem descrição)'};
  saveStatuses(currentDateStr, currentDayCode);
  closeSheet(true);
  renderBlocks();
}

function toggleTheme(){
  const html=document.documentElement;
  const btn=document.getElementById('theme-btn');
  if(html.getAttribute('data-theme')==='light'){
    html.removeAttribute('data-theme');
    btn.textContent='☀';
    localStorage.setItem('theme','dark');
  } else {
    html.setAttribute('data-theme','light');
    btn.textContent='🌙';
    localStorage.setItem('theme','light');
  }
}

function parseTime(t){
  // parse "HH:MM" from block time strings like "07:00–08:00" or "até 09:00" or "09:00+"
  const m = t.match(/(\d{1,2}):(\d{2})/);
  if(!m) return null;
  return parseInt(m[1])*60+parseInt(m[2]);
}

function getCurrentBlockIdx(blocks){
  const now = new Date();
  const nowMin = now.getHours()*60+now.getMinutes();
  // find block whose start <= now < next block start
  const starts = blocks.map(b=>parseTime(b.time));
  for(let i=starts.length-1;i>=0;i--){
    if(starts[i]!==null && nowMin>=starts[i]) return i;
  }
  return null;
}

function tickClock(){
  const now = new Date();
  const hh = String(now.getHours()).padStart(2,'0');
  const mm = String(now.getMinutes()).padStart(2,'0');
  document.getElementById('clock-time').textContent = hh+':'+mm;

  // only show current block if viewing today (same date, not just same weekday)
  const todayStr2 = toDateStr(new Date());
  if(currentDateStr !== todayStr2){ 
    document.getElementById('clock-current').textContent='';
    document.getElementById('clock-next').textContent='';
    return;
  }

  const blocks = getBlocks(currentPhase, selectedDay);
  const idx = getCurrentBlockIdx(blocks);
  const curEl = document.getElementById('clock-current');
  const nxtEl = document.getElementById('clock-next');

  if(idx!==null){
    const b = blocks[idx];
    curEl.textContent = b.label;
    // highlight current card
    document.querySelectorAll('.block-card').forEach((c,i)=>{
      c.classList.toggle('current-block', i===idx);
    });
    // next block
    if(idx+1<blocks.length){
      nxtEl.textContent = 'a seguir → '+blocks[idx+1].label+' ('+blocks[idx+1].time.split('–')[0]+')';
    } else {
      nxtEl.textContent = 'último bloco do dia';
    }
  } else {
    curEl.textContent = 'antes do primeiro bloco';
    nxtEl.textContent = blocks.length?'primeiro → '+blocks[0].label+' ('+blocks[0].time.split('–')[0]+')':'';
    document.querySelectorAll('.block-card').forEach(c=>c.classList.remove('current-block'));
  }
}

// init
(function(){
  const saved=localStorage.getItem('theme');
  if(saved==='light'){
    document.documentElement.setAttribute('data-theme','light');
    document.getElementById('theme-btn').textContent='🌙';
  }
  const today=new Date();
  selectedDay = JS_DAY_MAP[today.getDay()];
  renderAll();
  tickClock();
  setInterval(tickClock, 10000);
})();
</script>
</body>
</html>
